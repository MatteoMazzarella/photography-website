<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation | Matteo Mazzarella</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVIGATION */

        header {
            height: 80px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            position: sticky;
            top: 0;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #f0f6fc;
            text-decoration: none;
        }

        .back-btn {
            border: 1px solid #30363d;
            padding: 10px 18px;
            border-radius: 7px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn:hover {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
        }

        /* GALLERY SECTION */

        .gallery-section {
            padding: 60px 50px 100px 50px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #8b949e;
            font-size: 18px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #30363d;
            aspect-ratio: 4 / 3;
            background: #161b22;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* FOOTER */

        footer {
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            color: #8b949e;
            font-size: 14px;
            border-top: 1px solid #30363d;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 800px) {
            header {
                padding: 0 20px;
            }

            .gallery-section {
                padding: 40px 20px 70px 20px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .photo-grid {
                grid-template-columns: 1fr;
            }

            footer {
                padding: 30px 20px;
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            Matteo Mazzarella
        </a>

        <a href="index.html#gallery" class="back-btn">
            ← Back to Categories
        </a>
    </header>

    <main class="gallery-section">

        <div class="page-header">
            <h1>Aviation</h1>
            <p>My Passion — High Altitude & Wings over Switzerland</p>
        </div>

        <div class="photo-grid">

            <div class="grid-item">
                <img src="aviation/image0.jpeg" alt="Aviation Shot 1">
            </div>

            <div class="grid-item">
                <img src="aviation/IMG_9353.jpeg" alt="Aviation Shot 2">
            </div>

            <div class="grid-item">
                <img src="aviation/IMG_9329.jpeg" alt="Aviation Shot 3">
            </div>

            <div class="grid-item">
                <img src="aviation/5CC67E51-EE37-435B-B15B-25748203BE1C.jpeg" alt="Aviation Shot 4">
            </div>

        </div>

    </main>

    <footer>
        <div>
            © 2026 Matteo Photography
        </div>

        <div>
            Photography · Switzerland
        </div>
    </footer>

</body>
</html>
